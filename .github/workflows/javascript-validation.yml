
name: JavaScript Code Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-validation:
    name: Node.js ${{ matrix.node-version }} Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Node.js version
        run: node --version

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Validate test file syntax
        run: node --check tests/countdown.test.js

      - name: Run automated unit tests
        run: node --test tests/countdown.test.js
